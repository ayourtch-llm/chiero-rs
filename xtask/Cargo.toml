[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde_json.workspace = true
indexmap.workspace = true
# **The sweep runs chiero's own frontend.** xtask is outside the §4 dependency rules
# ("xtask and third-party crates are not part of the architecture"), so this edge is
# allowed where it would not be between the crates themselves.
chiero-pp.workspace = true
chiero-parse.workspace = true
chiero-ast.workspace = true
chiero-sema.workspace = true
chiero-lower.workspace = true
chiero-recipe.workspace = true
chiero-span.workspace = true
chiero-gcov.workspace = true
chiero-diff.workspace = true
chiero-select.workspace = true

[lints]
workspace = true

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"
