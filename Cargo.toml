[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
# Dual, as the Rust ecosystem is: a consumer may take either. Apache-2.0 alone excludes
# projects that cannot accept its patent and notice terms; MIT alone gives users no patent
# grant. Offering both is what makes this usable as a *library*, which is the whole point of
# 001 §1's crate-per-capability shape.
license = "MIT OR Apache-2.0"
repository = "https://github.com/ayourtch-llm/chiero-rs"

# Versions are unified across the workspace and bumped together (001 §6).
[workspace.dependencies]
chiero-span   = { path = "crates/chiero-span",   version = "0.1.0" }
chiero-lex    = { path = "crates/chiero-lex",    version = "0.1.0" }
chiero-pp     = { path = "crates/chiero-pp",     version = "0.1.0" }
chiero-probe  = { path = "crates/chiero-probe",  version = "0.1.0" }
chiero-ast    = { path = "crates/chiero-ast",    version = "0.1.0" }
chiero-parse  = { path = "crates/chiero-parse",  version = "0.1.0" }
chiero-sema   = { path = "crates/chiero-sema",   version = "0.1.0" }
chiero-lower  = { path = "crates/chiero-lower",  version = "0.1.0" }
chiero-cir    = { path = "crates/chiero-cir",    version = "0.1.0" }
chiero-solver = { path = "crates/chiero-solver", version = "0.1.0" }
chiero-mem    = { path = "crates/chiero-mem",    version = "0.1.0" }
chiero-model  = { path = "crates/chiero-model",  version = "0.1.0" }
chiero-exec   = { path = "crates/chiero-exec",   version = "0.1.0" }
chiero-gcov   = { path = "crates/chiero-gcov",   version = "0.1.0" }
chiero-diff   = { path = "crates/chiero-diff",   version = "0.1.0" }
chiero-select = { path = "crates/chiero-select", version = "0.1.0" }
chiero-check  = { path = "crates/chiero-check",  version = "0.1.0" }
chiero-replay = { path = "crates/chiero-replay", version = "0.1.0" }
chiero-opt    = { path = "crates/chiero-opt",    version = "0.1.0" }
chiero-recipe = { path = "crates/chiero-recipe", version = "0.1.0" }
chiero-vpp    = { path = "crates/chiero-vpp",    version = "0.1.0" }
chiero-tool   = { path = "crates/chiero-tool",   version = "0.1.0" }
chiero-cli    = { path = "crates/chiero-cli",    version = "0.1.0" }

# Determinism is mandatory (001 §5): no HashMap iteration in any output path.
indexmap = "2"
smallvec = "1"
# Recipe selectors (042 §4.2 `name matches <regex>`). Chosen over a literal matcher such as
# aho-corasick, which cannot express an anchor or a character class, and for its linear-time
# guarantee: 042 §7 has recipes authored by an LLM, and a backtracking engine would let a
# machine-written pattern hang the whole-VPP sweep.
regex = "1"
# Surface crates only.
anyhow = "1"
# **`preserve_order`.** Without it `serde_json`'s map is a `BTreeMap`, so every rendered
# result comes out in alphabetical key order — `verdict` last, under `replay`. Insertion order
# is fixed by the code that builds each result, so this is still byte-deterministic (001 §5),
# and it uses `indexmap`, which is the type this workspace already prefers for exactly that
# reason.
serde_json = { version = "1", features = ["preserve_order"] }
# gcov writes `--json-format` gzipped and the stem rule is gcc's to set (030 §3), so reading it
# is not optional. **`rust_backend`, with default features off**: the default links miniz via C,
# and §3 of the working notes makes "builds and runs with no external toolchain" a hard
# constraint. `miniz_oxide` underneath is pure Rust.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Determinism is a hard requirement (001 §5). These catch the two easiest ways to
# break it: iterating a HashMap/HashSet into an output path.
disallowed_types = "deny"

# **Optimised tests, with every debug check kept.**
#
# Measured 2026-08-07: `chiero-sema`'s `conversions` corpus test takes **53.7 s** built by the
# default dev profile and **7.95 s** built by release — 6.7x, and `cargo test` uses the former.
# §9.1's corpus-runtime item was written around the 53 s figure and proposed serialising the
# analyses to disk, which is real design work; this is the config line that has to be ruled out
# first.
#
# `debug-assertions` and `overflow-checks` are set **explicitly** rather than left to the
# profile's defaults. They are what make a debug test run mean something — a wrapping add that
# panics here is a defect this project wants to hear about — and `opt-level` is exactly the
# knob whose neighbours a reader would assume it changed.
[profile.dev]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.release]
debug = 1
