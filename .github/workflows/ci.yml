name: CI

# Gates are specified in docs/specs/070-testing-and-tdd-protocol.md §4.
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 001 contract 6 / 022 contract 1: the minimal build must link no external solver.
      - name: Build (no default features)
        run: cargo build --workspace --no-default-features

      - name: Build
        run: cargo build --workspace

      # 001 contract 8 (graph rules 1,2,3,5,6,7).
      - name: Dependency rules
        run: cargo xtask check-deps

      # 001 contract 5 / §4 rule 4 — not graph-decidable, so a separate gate.
      - name: VPP leak check
        run: cargo xtask check-vpp-leak

      - name: Test
        run: cargo test --workspace
