name: CI

# Gates are specified in docs/specs/070-testing-and-tdd-protocol.md §4.
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # **Both solver configurations, because both are contracts.**
  #
  # 022 §4 discovers a backend on `PATH` at *run* time, through a subprocess, and 001 §6
  # requires the build to link none. So there are two behaviours to keep honest and they are
  # different claims:
  #
  #   solver: none  — 022 contract 2. A machine with no z3 must behave exactly as `LiteOnly`:
  #                   answer what tier 1 can answer and say `Unknown` for the rest, never a
  #                   wrong answer. This is the configuration a reader gets by default, and
  #                   until now it was the *only* one CI ran — by accident rather than design.
  #   solver: z3    — the solver-dependent half of the suite. Five `chiero-check` tests assert
  #                   what a complete solver decides about forced overflow; with no backend
  #                   they have nothing to decide against and now skip, and a skip in the one
  #                   place that runs on every commit is 070 §4's "a gate nobody runs is a gate
  #                   that is already failing".
  #
  # The `none` job pins `CHIERO_SMT_SOLVER` at a path that does not exist rather than trusting
  # the runner image to lack z3: a configuration that depends on an unstated assumption is not
  # a configuration, and the day the image ships a solver this job would quietly stop testing
  # what it is named for.
  build-and-test:
    name: "build-and-test (solver: ${{ matrix.solver }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solver: [none, z3]
    # **Both legs gate.** `none` was red when this matrix was added — a dozen suites, every one
    # asserting a *proof* tier 1 cannot produce — and it is green as of 2026-08-07: each was
    # either given an explicit skip (the claim is about what a complete solver decides) or
    # widened to accept both causes (the claim survives either tier and only the recorded
    # reason differs). One was neither, and was a real defect: `check_reachable` called a dead
    # line `reachable` and `proven` because the state arrived through a branch nobody decided.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install z3
        if: matrix.solver == 'z3'
        run: |
          sudo apt-get update && sudo apt-get install -y z3
          z3 --version

      # Belt and braces: `discover()` consults `$CHIERO_SMT_SOLVER` first, so pointing it at
      # nothing is "no solver" whatever the image happens to carry.
      - name: Pin the solverless configuration
        if: matrix.solver == 'none'
        run: echo "CHIERO_SMT_SOLVER=/nonexistent/no-solver-in-this-job" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 001 contract 6 / 022 contract 1: the minimal build must link no external solver.
      # **Run in both jobs on purpose** — this is the step that says installing z3 above
      # changed what the tests can decide and not what the build depends on.
      - name: Build (no default features)
        run: cargo build --workspace --no-default-features

      - name: Build
        run: cargo build --workspace

      # 001 contract 8 (graph rules 1,2,3,5,6,7).
      - name: Dependency rules
        run: cargo xtask check-deps

      # 001 contract 5 / §4 rule 4 — not graph-decidable, so a separate gate.
      - name: VPP leak check
        run: cargo xtask check-vpp-leak

      # 023 contract 13a: a proof cannot be forged. 070 §4 lists this as a gate and it was
      # only ever run by hand — a gate nobody runs is a gate that is already failing.
      - name: Proof surface
        run: cargo xtask check-proof-surface

      - name: Test
        run: cargo test --workspace

      # A report rather than a gate (it exits 0 whatever it finds), printed so a reviewer can
      # see coverage move in the log without running anything themselves. 070 §6.
      - name: Contract coverage
        run: cargo xtask contract-coverage
